<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>旅費分帳</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="旅費分帳">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1E5B57">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ECF1EF; --card:#FFFFFF; --ink:#16302E; --muted:#5D716E; --line:#CFDAD6;
  --teal:#1E5B57; --teal-soft:#D6E7E3; --stamp:#E2A52A; --stamp-soft:#FBEFD2;
  --owe:#C2462F; --owe-soft:#F8E1DB; --get:#2F7D4F; --get-soft:#DDEFE3;
  --shadow:0 1px 0 rgba(22,48,46,.08);
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1C1B; --card:#172826; --ink:#E4EEEB; --muted:#94A9A5; --line:#2B403D;
    --teal:#7CC5BC; --teal-soft:#1F3C39; --stamp:#F0BC52; --stamp-soft:#3A3020;
    --owe:#F08A73; --owe-soft:#3D2420; --get:#7FCF9C; --get-soft:#1E3627;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1C1B; --card:#172826; --ink:#E4EEEB; --muted:#94A9A5; --line:#2B403D;
  --teal:#7CC5BC; --teal-soft:#1F3C39; --stamp:#F0BC52; --stamp-soft:#3A3020;
  --owe:#F08A73; --owe-soft:#3D2420; --get:#7FCF9C; --get-soft:#1E3627;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--stamp);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.wrap{max-width:880px;margin:0 auto;padding:0 16px 120px}
.top{display:flex;align-items:center;gap:12px;padding:18px 0 10px}
.brand{font-family:var(--serif);font-weight:900;font-size:1.5rem;letter-spacing:.04em;margin:0;flex:1;cursor:pointer}
.brand small{font-family:var(--sans);font-weight:400;font-size:.8rem;color:var(--muted);letter-spacing:0;margin-left:8px}
.sync{font-size:.78rem;color:var(--muted);white-space:nowrap}

.btn{white-space:nowrap;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;min-height:42px;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.primary{background:var(--teal);border-color:var(--teal);color:var(--paper);font-weight:500}
.btn.ghost{background:transparent;border-color:transparent;color:var(--teal);padding:9px 8px}
.btn.danger{color:var(--owe);border-color:var(--owe-soft)}
.btn.small{min-height:34px;padding:5px 10px;font-size:.88rem}
.btn:disabled{opacity:.5;cursor:default}
.icon{width:42px;padding:0}

.field{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted)}
.field input,.field select,.field textarea,.inp{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 11px;min-height:42px;font-size:1rem;color:var(--ink);width:100%}
.field textarea{min-height:64px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row>.field{flex:1 1 140px}

.searchbar{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;grid-template-columns:1fr;gap:10px;margin:6px 0 20px}
.searchbar .dates{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.searchbar .dates input{flex:1 1 130px}
@media(min-width:640px){.searchbar{grid-template-columns:1fr auto}}

h2.sec{flex-wrap:wrap;row-gap:8px;font-family:var(--serif);font-weight:600;font-size:1.15rem;margin:22px 0 10px;display:flex;align-items:center;gap:10px}
h2.sec .grow{flex:1;white-space:nowrap}

/* trips as luggage tags */
.trips{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.tag{position:relative;background:var(--card);border:1px solid var(--line);border-radius:6px 18px 18px 6px;padding:16px 16px 14px 30px;text-align:left;width:100%;box-shadow:var(--shadow)}
.tag::before{content:"";position:absolute;left:10px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:var(--paper);border:1px solid var(--line)}
.tag h3{font-family:var(--serif);font-size:1.2rem;margin:0 0 2px;font-weight:600}
.tag .meta{color:var(--muted);font-size:.85rem}
.tag .amt{font-size:1.3rem;font-weight:700;margin-top:8px}

.empty{border:1.5px dashed var(--line);border-radius:14px;padding:28px 18px;text-align:center;color:var(--muted)}
.empty p{margin:0 0 12px}

/* trip header */
.trip-head{background:var(--teal);color:var(--paper);border-radius:16px;padding:18px;margin-top:4px;position:relative;overflow:hidden}
.trip-head h1{font-family:var(--serif);font-weight:900;font-size:clamp(1.5rem,5vw,2.1rem);margin:0;line-height:1.2}
.trip-head .meta{opacity:.85;font-size:.9rem;margin-top:4px}
.trip-head .stats{display:flex;gap:22px;margin-top:14px;flex-wrap:wrap}
.trip-head .stats b{display:block;font-size:1.35rem}
.trip-head .stats span{font-size:.8rem;opacity:.8}
.trip-head .edit{position:absolute;top:12px;right:12px;background:transparent;border:1px solid rgba(255,255,255,.35);color:var(--paper)}

.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);display:flex;gap:4px;padding:12px 0 8px;margin-bottom:4px}
.tabs button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:10px;min-height:42px;font-weight:500;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.dayhead{display:flex;align-items:baseline;gap:10px;margin:18px 0 8px;font-weight:700}
.dayhead span{color:var(--muted);font-weight:400;font-size:.85rem}
.dayhead::after{content:"";flex:1;border-bottom:1px solid var(--line)}

.rc{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;width:100%;text-align:left;margin-bottom:8px}
.rc .th{width:52px;height:52px;border-radius:8px;object-fit:cover;background:var(--teal-soft);flex:none;display:grid;place-items:center;color:var(--teal);font-size:1.3rem}
.rc .body{flex:1;min-width:0}
.rc .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc .s{font-size:.82rem;color:var(--muted)}
.rc .a{font-weight:700;font-size:1.05rem;text-align:right}
.badge{display:inline-block;font-size:.72rem;padding:1px 7px;border-radius:99px;background:var(--stamp-soft);color:var(--ink);border:1px solid var(--stamp);margin-left:4px;vertical-align:1px}
.badge.bad{background:var(--owe-soft);border-color:var(--owe)}

.queue{background:var(--stamp-soft);border:1px solid var(--stamp);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:.9rem}
.queue div{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
.notice{background:var(--owe-soft);border:1px solid var(--owe);border-radius:12px;padding:10px 12px;font-size:.9rem;margin:10px 0}
.hint{color:var(--muted);font-size:.85rem}

.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:8;display:flex;gap:8px;background:var(--ink);padding:6px;border-radius:16px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.fab .btn{border:none;background:transparent;color:var(--paper)}
.fab .btn.primary{background:var(--stamp);color:#1b1b1b}

/* members */
.people{display:flex;flex-direction:column;gap:8px}
.person{display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none;font-size:.95rem}
.avatar.img{object-fit:cover;border-radius:50%;flex:none;display:block}
.avbtn{position:relative;border:none;background:transparent;padding:0;flex:none;border-radius:50%}
.avbtn .cam{position:absolute;right:-4px;bottom:-4px;font-size:12px;background:var(--card);border:1px solid var(--line);border-radius:50%;width:20px;height:20px;display:grid;place-items:center}
.pick{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.pick button{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:3px 12px 3px 3px;min-height:38px}
.pick button[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:var(--paper)}
.ticket .who .avatar,.ticket .who img{width:30px;height:30px}
.crop-ov{z-index:30}
.addphoto{display:block;width:100%;min-height:72px;border:1.5px dashed var(--line);border-radius:12px;background:transparent;color:var(--teal);font-weight:500;margin-bottom:12px}
.pitems{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px 14px 10px}
.pcard summary{display:flex;align-items:center;gap:10px;padding:8px 0;cursor:pointer;list-style:none;font-weight:700}
.pcard summary::-webkit-details-marker{display:none}
.pcard .grow{flex:1}
.pi-rc{font-size:.8rem;color:var(--muted);margin:10px 0 2px;padding-top:6px;border-top:1px solid var(--line)}
.pi-line{display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-size:.92rem}
.pi-line small{color:var(--muted);margin-left:6px;font-size:.75rem}
.pi-line b{font-weight:500}
.pi-line.svc{color:var(--muted)}
.ask-ov{z-index:50;align-items:center;padding:24px}
.sheet.ask{max-width:380px;border-radius:16px}
.btn.danger-fill{background:var(--owe);border-color:var(--owe);color:#fff}
.sheet.crop{max-width:420px}
.crop-cv{touch-action:none;border-radius:12px;background:#000;cursor:grab}
.crop-tools{display:flex;align-items:center;gap:10px;width:100%;max-width:320px}
.crop-tools input[type=range]{flex:1;accent-color:var(--teal)}
.person input{flex:1;border:none;background:transparent;min-height:36px;font-size:1rem;padding:0 4px}

/* settlement */
.ledger{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.ledger th,.ledger td{padding:10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.ledger th:first-child,.ledger td:first-child{text-align:left}
.ledger th{font-size:.8rem;color:var(--muted);font-weight:500}
.ledger tr:last-child td{border-bottom:none}
.pos{color:var(--get);font-weight:700}.neg{color:var(--owe);font-weight:700}
.scroll{overflow-x:auto}

.tickets{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.ticket{position:relative;display:grid;grid-template-columns:1fr auto;background:var(--stamp-soft);border:1px solid var(--stamp);border-radius:12px;overflow:hidden}
.ticket .main{padding:14px 16px}
.ticket .who{font-family:var(--serif);font-weight:600;font-size:1.1rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ticket .arrow{color:var(--muted);font-family:var(--sans);font-size:.85rem}
.ticket .stub{border-left:2px dashed var(--stamp);padding:14px 16px;display:flex;flex-direction:column;justify-content:center;align-items:flex-end;width:140px}
.ticket .stub b{font-size:1.35rem}
.ticket .stub span{font-size:.75rem;color:var(--muted)}
.ticket::before,.ticket::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:var(--paper);right:calc(140px - 9px);border:1px solid var(--stamp)}
.ticket::before{top:-9px}.ticket::after{bottom:-9px}
.settled{padding:22px;text-align:center;background:var(--get-soft);border-radius:12px;color:var(--get);font-weight:700}

/* sheet / editor */
.overlay{position:fixed;inset:0;background:rgba(10,20,19,.55);z-index:20;display:flex;justify-content:center;align-items:flex-end}
@media(min-width:720px){.overlay{align-items:center;padding:24px}}
.sheet{background:var(--paper);width:100%;max-width:720px;max-height:100%;display:flex;flex-direction:column;border-radius:18px 18px 0 0;overflow:hidden}
@media(min-width:720px){.sheet{border-radius:18px;max-height:92vh}}
.sheet-head{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;border-bottom:1px solid var(--line);background:var(--card)}
@media(min-width:720px){.sheet-head{padding-top:10px}}
.sheet-head h3{flex:1;margin:0;font-size:1.05rem;text-align:center}
.sheet-body{overflow-y:auto;padding:14px 14px 20px;-webkit-overflow-scrolling:touch}
.sheet-foot{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--card)}
.sheet-foot .grow{flex:1}
.photo{display:block;width:100%;max-height:220px;object-fit:contain;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;cursor:zoom-in}
.photo.big{max-height:none;cursor:zoom-out}

.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
.item .line{display:flex;gap:8px;align-items:center}
.item .line .name{flex:1;min-width:0}
.item .line .amt{width:110px;text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1px solid var(--line);background:transparent;border-radius:99px;padding:3px 11px;font-size:.85rem;min-height:32px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:var(--paper)}
.chip.all[aria-pressed="true"]{background:var(--stamp);border-color:var(--stamp);color:#1b1b1b}
.ratios{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px;margin-top:8px}
.ratio{display:grid;grid-template-columns:1fr 80px auto;gap:8px;align-items:center;font-size:.9rem}
.ratio input{min-height:36px;padding:5px 8px;text-align:center}
.ratio b{min-width:70px;text-align:right;font-weight:500;color:var(--muted)}
.chartbox{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.legend{display:flex;gap:16px;font-size:.85rem;color:var(--muted);margin-bottom:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.bar-row{display:grid;grid-template-columns:minmax(60px,110px) 1fr auto;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.bar-row:first-of-type{border-top:none}
.bar-row .nm{font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{display:flex;flex-direction:column;gap:3px}
.track i{display:block;height:9px;border-radius:5px;min-width:2px}
.vals{font-size:.8rem;text-align:right;line-height:1.3;color:var(--muted)}
.sumline{display:flex;justify-content:space-between;align-items:center;padding:10px 4px;font-weight:700;font-size:1.05rem}
.status{font-size:.88rem;padding:8px 10px;border-radius:10px;margin-top:6px}
.status.ok{background:var(--get-soft);color:var(--get)}
.status.no{background:var(--owe-soft);color:var(--owe)}
.payer{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.payer select{flex:1}
.payer .amt{width:120px;text-align:right}
.x{border:none;background:transparent;color:var(--muted);width:36px;height:36px;font-size:1.2rem;flex:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:10px;z-index:40;font-size:.9rem}
.hidden{display:none!important}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.4}}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 class="brand" data-act="home">旅費分帳<small>拍收據・自動分攤</small></h1>
    <span class="sync" id="sync"></span>
  </header>
  <main id="app"></main>
</div>
<div id="fab"></div>
<div id="modal"></div>
<input type="file" id="file" accept="image/*" multiple class="hidden">
<input type="file" id="rcPhoto" accept="image/*" class="hidden">
<input type="file" id="avatarFile" accept="image/*" class="hidden">
<script>
(function(){
"use strict";
/* ---------- state ---------- */
const S={contacts:[],trips:[],receipts:[],view:"home",tripId:null,tab:"receipts",q:"",from:"",to:"",tq:"",edit:null,queue:[],bigPhoto:false};
const LS="tripsplit.v1";
const COLORS=["#1E5B57","#C2462F","#7A5AA6","#2F7D4F","#B07A12","#2C6FA3","#A64B79","#5E6B2B"];
let db=null,uid=null,sample=null,canImg=false,downloads=null,sampleState="loading",aiOff="";
function aiReady(){return sampleState==="loading"||(sample&&canImg&&!aiOff)}
let imgOff=false,assets=null,isOwner=false;
const RELAY="請幫我辨識「旅費分帳」裡等待辨識的收據";
function aiWhy(){if(aiOff)return aiOff;if(!window.claude)return "這個頁面不是在 Claude 裡開啟，無法自動辨識。";if(!sample)return "目前的檢視無法呼叫 Claude（可能未登入，或在不支援的地方開啟）。";return "這個檢視目前不支援直接傳圖片給 Claude。"}

const $=s=>document.querySelector(s);
const uidGen=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const cents=x=>Math.round((Number(x)||0)*100);
const trip=()=>S.trips.find(t=>t.id===S.tripId);
const recOf=tid=>S.receipts.filter(r=>r.tripId===tid);
function money(c,cur){const v=c/100;const s=v.toLocaleString("zh-TW",{minimumFractionDigits:0,maximumFractionDigits:2});return (cur&&cur!=="TWD"?cur+" ":"$")+s}
function fmtDate(d){if(!d)return"未標日期";const x=new Date(d+"T00:00");if(isNaN(x))return d;return (x.getMonth()+1)+"月"+x.getDate()+"日"}
function wk(d){const x=new Date(d+"T00:00");return isNaN(x)?"":"週"+"日一二三四五六"[x.getDay()]}
function range(t){if(!t.start&&!t.end)return"未設定日期";const a=(t.start||"").replace(/-/g,"/"),b=(t.end||"").replace(/-/g,"/");return b&&b!==a?a+" – "+b.slice(5):a||b}
const C=id=>S.contacts.find(c=>c.id===id);
function pname(t,id){const c=C(id);if(c&&c.name)return c.name;const p=t&&t.people.find(p=>p.id===id);return p?p.name:"(已移除)"}
function pcolor(t,id){let h=0;for(const ch of String(id))h=(h*31+ch.charCodeAt(0))>>>0;return COLORS[h%COLORS.length]}
function av(id,size=34,t=null,act=false){const c=C(id),n=pname(t,id);const st=`width:${size}px;height:${size}px;font-size:${Math.round(size*.42)}px`;
  const inner=c&&c.avatar?`<img src="${c.avatar}" alt="" style="${st}" class="avatar img">`:`<span class="avatar" style="${st};background:${pcolor(t,id)}">${esc(n.slice(0,1))}</span>`;
  return act?`<button class="avbtn" data-act="pickAvatar" data-id="${id}" aria-label="更換 ${esc(n)} 的頭像">${inner}<span class="cam">📷</span></button>`:inner}
function toast(msg){const el=document.createElement("div");el.className="toast";el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),2200)}

/* ---------- storage ---------- */
let _idb=null;
function idb(){if(_idb)return _idb;_idb=new Promise((res,rej)=>{try{const q=indexedDB.open("tripsplit",1);q.onupgradeneeded=()=>q.result.createObjectStore("kv");q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)}catch(e){rej(e)}});return _idb}
function idbOp(mode,fn){return idb().then(d=>new Promise((res,rej)=>{const tx=d.transaction("kv",mode),st=tx.objectStore("kv"),q=fn(st);tx.oncomplete=()=>res(q&&q.result);tx.onerror=()=>rej(tx.error)}))}
const idbGet=k=>idbOp("readonly",st=>st.get(k)).catch(()=>undefined),idbSet=(k,v)=>idbOp("readwrite",st=>st.put(v,k)).catch(e=>{console.warn(e)}),idbDel=k=>idbOp("readwrite",st=>st.delete(k)).catch(()=>{});
let _saveT=null;
function saveLocal(){const v={contacts:S.contacts,trips:S.trips,receipts:S.receipts};
  try{localStorage.setItem(LS,JSON.stringify(v))}catch(e){try{localStorage.removeItem(LS)}catch(_){}}
  clearTimeout(_saveT);_saveT=setTimeout(()=>idbSet("state",JSON.parse(JSON.stringify(v))),150)}
async function loadIDB(){const v=await idbGet("state");if(v&&!db&&(v.trips||[]).length+(v.contacts||[]).length>=S.trips.length+S.contacts.length){S.contacts=v.contacts||[];S.trips=v.trips||[];S.receipts=v.receipts||[];migrate();render()}}
function loadLocal(){try{const v=JSON.parse(localStorage.getItem(LS)||"null");if(v){S.contacts=v.contacts||[];S.trips=v.trips||[];S.receipts=v.receipts||[]}}catch(e){}migrate()}
function migrate(){const seen=new Set(S.contacts.map(c=>c.id));const add=[];
  S.trips.forEach(t=>t.people.forEach(p=>{if(!seen.has(p.id)){seen.add(p.id);const c={kind:"contact",id:p.id,name:p.name,avatar:"",created:new Date().toISOString()};S.contacts.push(c);add.push(c)}}));return add}
function col(){return db.collection("data/users/"+uid)}
function persist(obj){saveLocal();if(db)col().doc(obj.id).set(JSON.parse(JSON.stringify(obj))).catch(e=>{console.warn(e);setSync("雲端儲存失敗，已存在本機")})}
function mainQ(){return col().where("kind","in",["trip","receipt","contact"]).limit(1000)}
/* full-resolution photos, stored in chunks so a receipt doc stays small */
const PH={},CH=240000;
async function savePhoto(rid,data){PH[rid]=data;const n=Math.ceil(data.length/CH);
  if(db){for(let i=0;i<n;i++)await col().doc(rid+"_p"+i).set({kind:"chunk",rc:rid,i,n,d:data.slice(i*CH,(i+1)*CH)});return n}
  await idbSet("photo."+rid,data);return n}
async function getPhoto(r){if(PH[r.id])return PH[r.id];if(!r.photoN)return null;
  if(db){try{const sn=await col().where("rc","==",r.id).limit(60).get();const parts=sn.docs.map(d=>d.data()).filter(Boolean).sort((a,b)=>a.i-b.i);
    if(parts.length===r.photoN){PH[r.id]=parts.map(p=>p.d).join("");return PH[r.id]}}catch(e){console.warn(e)}}
  const v=await idbGet("photo."+r.id);if(v){PH[r.id]=v;return v}return null}
function delPhoto(r){if(!r||!r.photoN)return;for(let i=0;i<r.photoN;i++)remove(r.id+"_p"+i);delete PH[r.id];idbDel("photo."+r.id)}
function remove(id){saveLocal();if(db)col().doc(id).delete().catch(e=>console.warn(e))}
function setSync(t){$("#sync").textContent=t}

async function initRuntime(){
  if(!window.claude||!claude.use){setupApi();setSync("資料存在這支手機");render();return}
  claude.use("sample").then(async s=>{sample=s;if(s){const l=await s.limits().catch(()=>null);canImg=!!(l&&l.images)}sampleState="done";render()});
  claude.use("downloads").then(d=>{downloads=d;render()});
  claude.use("assets").then(a=>{assets=a;render()});
  try{
    const [d,u]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!d||!u){setSync("資料存在此裝置");return}
    const id=await u.id(); if(!id){setSync("資料存在此裝置");return}
    isOwner=!!(await Promise.resolve(u.isOwner&&u.isOwner()).catch(()=>false));
    const can=await Promise.resolve(u.can?u.can("data.write"):null).catch(()=>null);
    if(can===false){setSync("資料存在此裝置");render();return}
    try{await d.collection("data/users/"+id).doc("_probe").set({kind:"probe",t:Date.now()})}catch(e){setSync("資料存在此裝置");render();return}
    db=d;uid=id;setSync("同步中…");
    const snap=await mainQ().get();
    const trips=[],rcs=[],cts=[];
    snap.docs.forEach(x=>{const v0=x.data();if(!v0)return;const v=JSON.parse(JSON.stringify(v0));if(v.kind==="trip")trips.push(v);else if(v.kind==="receipt")rcs.push(v);else if(v.kind==="contact")cts.push(v)});
    if(trips.length||rcs.length||cts.length){S.trips=trips;S.receipts=rcs;S.contacts=cts;migrate().forEach(persist);saveLocal()}
    else if(S.trips.length||S.contacts.length){[...S.contacts,...S.trips,...S.receipts].forEach(persist)}
    setSync("已同步到你的帳號");render();
    mainQ().onSnapshot(sn=>{const tr=[],rc=[],ct=[];sn.docs.forEach(x=>{const v0=x.data();if(!v0)return;const v=JSON.parse(JSON.stringify(v0));if(v.kind==="trip")tr.push(v);else if(v.kind==="receipt")rc.push(v);else if(v.kind==="contact")ct.push(v)});
      S.contacts=ct;
      const before=new Set(S.receipts.filter(r=>r.pending).map(r=>r.id));
      S.trips=tr;S.receipts=rc;saveLocal();
      const done=rc.filter(r=>before.has(r.id)&&!r.pending);
      if(done.length)toast("Claude 已辨識 "+done.length+" 張收據");
      if(S.edit&&S.edit.type==="rc"){const fresh=done.find(r=>r.id===S.edit.data.id);if(fresh){S.edit.data=JSON.parse(JSON.stringify(fresh));renderModal()}}
      const ae=document.activeElement;if(ae&&ae.dataset&&ae.dataset.f==="pname"&&!done.length)return;
      render()},e=>console.warn(e));
  }catch(e){console.warn(e);db=null;setSync("資料存在此裝置")}
}

/* ---------- calculations ---------- */
function itemIds(t,it){const all=t.people.map(p=>p.id);if(!it.split||!it.split.length)return all;const ids=it.split.filter(id=>all.includes(id));return ids.length?ids:all}
function parseW(v){v=String(v??"").trim();if(!v)return 0;let n;if(v.includes("/")){const [a,b]=v.split("/").map(Number);n=b?a/b:0}else if(v.endsWith("%"))n=parseFloat(v)/100;else n=Number(v);return isFinite(n)&&n>0?n:0}
function itemAlloc(t,it){const all=t.people.map(p=>p.id);
  if(it.mode==="ratio"&&it.weights){const ws=all.map(id=>[id,parseW(it.weights[id])]).filter(x=>x[1]>0);if(ws.length)return ws}
  return itemIds(t,it).map(id=>[id,1])}
function alloc(c,ws){const sign=c<0?-1:1,a=Math.abs(c),W=ws.reduce((s,x)=>s+x[1],0);
  const raw=ws.map(([id,w])=>a*w/W),base=raw.map(Math.floor);let rem=a-base.reduce((s,x)=>s+x,0);
  raw.map((v,i)=>[v-base[i],i]).sort((x,y)=>y[0]-x[0]).forEach(([,i])=>{if(rem>0){base[i]++;rem--}});
  const m={};ws.forEach(([id],i)=>m[id]=sign*base[i]);return m}
function wLabel(t,it){const ws=itemAlloc(t,it);if(it.mode!=="ratio")return ws.map(([id])=>pname(t,id)).join("/");return ws.map(([id,w])=>pname(t,id)+"×"+(it.weights[id]||w)).join("/")}
function svcPct(r){const v=parseFloat(r.svc);return isFinite(v)&&v>0?v:0}
function rSub(r){return r.items.reduce((s,i)=>s+cents(i.amount),0)}
function rSvc(r){return Math.round(rSub(r)*svcPct(r)/100)}
function rTotal(r){return rSub(r)+rSvc(r)}
function rPaid(r){return (r.payers||[]).reduce((s,p)=>s+cents(p.amount),0)}
function rOK(r){return (r.payers||[]).length>0&&rPaid(r)===rTotal(r)}
function lines(t,r){const L={};t.people.forEach(p=>L[p.id]=[]);const base={};t.people.forEach(p=>base[p.id]=0);
  r.items.forEach(it=>{const ws=itemAlloc(t,it);if(!ws.length)return;const a=alloc(cents(it.amount),ws);for(const k in a)if(k in L&&a[k]){L[k].push({name:it.name||"項目",amt:a[k],how:ws.length===1?"自付":it.mode==="ratio"?"比例 "+(it.weights[k]||""):ws.length===t.people.length?"全員平均":ws.length+" 人平分"});base[k]+=a[k]}});
  const sv=rSvc(r);if(sv){const ws=Object.entries(base).filter(([,v])=>v>0);if(ws.length){const a=alloc(sv,ws);for(const k in a)if(a[k])L[k].push({name:"服務費 "+svcPct(r)+"%",amt:a[k],how:"依餐點比例",svc:true})}}
  return L}
function shares(t,r){const L=lines(t,r),m={};for(const k in L)m[k]=L[k].reduce((s,x)=>s+x.amt,0);return m}
function summary(t){const rs=recOf(t.id);const owe={},paid={};t.people.forEach(p=>{owe[p.id]=0;paid[p.id]=0});
  let total=0;rs.forEach(r=>{total+=rTotal(r);const s=shares(t,r);for(const k in s)owe[k]+=s[k];(r.payers||[]).forEach(p=>{if(p.pid in paid)paid[p.pid]+=cents(p.amount)})});
  const bal={};t.people.forEach(p=>bal[p.id]=paid[p.id]-owe[p.id]);
  return {total,owe,paid,bal,transfers:settle(bal),bad:rs.filter(r=>!rOK(r))}}
function settle(bal){const cr=[],de=[];for(const k in bal){if(bal[k]>0)cr.push([k,bal[k]]);else if(bal[k]<0)de.push([k,-bal[k]])}
  cr.sort((a,b)=>b[1]-a[1]);de.sort((a,b)=>b[1]-a[1]);const out=[];let i=0,j=0;
  while(i<de.length&&j<cr.length){const a=Math.min(de[i][1],cr[j][1]);if(a>0)out.push({from:de[i][0],to:cr[j][0],amt:a});de[i][1]-=a;cr[j][1]-=a;if(!de[i][1])i++;if(!cr[j][1])j++}
  return out}

/* ---------- views ---------- */
function render(){
  const app=$("#app");
  if(S.view==="trip"&&trip())app.innerHTML=viewTrip();else{S.view="home";app.innerHTML=viewHome()}
  renderFab();
  const m=$("#modal");if(!S.edit||m.dataset.key!==S.edit.data.id)renderModal();
}
function viewHome(){
  const q=S.q.trim().toLowerCase(),searching=q||S.from||S.to;
  let h=`<div class="searchbar"><input class="inp" data-f="q" placeholder="搜尋旅程、店家、品項、人名…" value="${esc(S.q)}" aria-label="搜尋關鍵字">
  <div class="dates"><input class="inp" type="date" data-f="from" value="${S.from}" aria-label="起始日期"><span class="hint">至</span><input class="inp" type="date" data-f="to" value="${S.to}" aria-label="結束日期">${searching?`<button class="btn ghost" data-act="clearSearch">清除</button>`:""}</div></div>`;
  if(searching){
    const hits=S.receipts.filter(r=>{const t=S.trips.find(x=>x.id===r.tripId);if(!t)return false;
      if(S.from&&(!r.date||r.date<S.from))return false;if(S.to&&(!r.date||r.date>S.to))return false;if(!q)return true;
      const names=[...(r.payers||[]).map(p=>pname(t,p.pid)),...r.items.flatMap(i=>itemAlloc(t,i).map(([id])=>pname(t,id)))];
      return [t.name,r.store,r.note,...r.items.map(i=>i.name),...names].join(" ").toLowerCase().includes(q)});
    h+=`<h2 class="sec">搜尋結果<span class="hint">${hits.length} 筆收據</span></h2>`;
    if(!hits.length)h+=`<div class="empty"><p>找不到符合的收據。換個關鍵字或調整日期範圍試試。</p></div>`;
    hits.sort((a,b)=>(b.date||"").localeCompare(a.date||"")).forEach(r=>{const t=S.trips.find(x=>x.id===r.tripId);h+=rcRow(t,r,true)});
    return h;
  }
  h+=`<h2 class="sec"><span class="grow">我的旅程</span><button class="btn" data-act="contacts">常用成員</button>${!window.claude?`<button class="btn icon" data-act="settings" aria-label="照片辨識設定" title="照片辨識設定">⚙︎</button>`:""}<button class="btn primary" data-act="newTrip">＋ 新增旅程</button></h2>`;
  if(!S.trips.length)return h+`<div class="empty"><p>還沒有旅程。建立一個旅程、加入同行成員，再上傳收據照片就能自動辨識金額。</p><button class="btn primary" data-act="newTrip">建立第一個旅程</button></div>`;
  h+=`<div class="trips">`;
  [...S.trips].sort((a,b)=>(b.start||b.created||"").localeCompare(a.start||a.created||"")).forEach(t=>{
    const s=summary(t);h+=`<button class="tag" data-act="openTrip" data-id="${t.id}"><h3>${esc(t.name)}</h3><div class="meta">${range(t)}・${t.people.length} 人・${recOf(t.id).length} 張收據</div><div class="amt num">${money(s.total,t.currency)}</div>${s.bad.length?`<span class="badge bad">${s.bad.length} 張待確認</span>`:""}</button>`});
  return h+`</div>`;
}
function rs0(t){return recOf(t.id)}
function rcRow(t,r,showTrip){
  const tot=rTotal(r),ok=rOK(r);
  const payers=(r.payers||[]).map(p=>pname(t,p.pid)).join("、")||"尚未指定";
  return `<button class="rc" data-act="openRc" data-id="${r.id}">${r.thumb?`<img class="th" src="${r.thumb}" alt="">`:`<span class="th">🧾</span>`}
  <span class="body"><div class="t">${esc(r.store||"未命名消費")}${r.pending?`<span class="badge">等待 Claude 辨識</span>`:ok?"":`<span class="badge bad">${(r.payers||[]).length?"付款金額不符":"待填付款人"}</span>`}</div>
  <div class="s">${showTrip?esc(t.name)+"・"+fmtDate(r.date)+"・":""}${r.items.length} 項・付款：${esc(payers)}</div></span>
  <span class="a num">${money(tot,t.currency)}</span></button>`;
}
function viewTrip(){
  const t=trip(),s=summary(t);
  let h=`<div class="trip-head"><button class="btn small edit" data-act="editTrip">編輯</button><h1>${esc(t.name)}</h1><div class="meta">${range(t)}</div>
  <div class="stats"><div><b class="num">${money(s.total,t.currency)}</b><span>總花費</span></div><div><b class="num">${t.people.length?money(Math.round(s.total/t.people.length),t.currency):"—"}</b><span>每人平均</span></div><div><b>${recOf(t.id).length}</b><span>張收據</span></div></div></div>
  <div class="tabs" role="tablist">${[["receipts","收據"],["people","成員 "+t.people.length],["settle","結算"]].map(([k,l])=>`<button role="tab" aria-selected="${S.tab===k}" data-act="tab" data-id="${k}">${l}</button>`).join("")}</div>`;
  if(S.tab==="people")h+=tabPeople(t);else if(S.tab==="settle")h+=tabSettle(t,s);else h+=tabReceipts(t);
  return h;
}
function tabReceipts(t){
  let h="";
  if(!t.people.length)h+=`<div class="notice">先到「成員」加入同行的人，才能分攤費用。<button class="btn small" data-act="tab" data-id="people" style="margin-left:6px">加入成員</button></div>`;
  if(S.queue.length)h+=`<div class="queue">${S.queue.map(q=>`<div><span>${esc(q.name)}</span><b>${q.status}</b></div>`).join("")}</div>`;
  const pend=rs0(t).filter(r=>r.pending).length;
  if(pend&&isOwner)h+=`<div class="queue"><b>${pend} 張收據等待 Claude 辨識。</b>回到和 Claude 的對話，傳送下面這句話，Claude 會讀取照片並自動填回這裡（這個頁面會即時更新）。
    <div style="display:flex;gap:8px;align-items:center;margin-top:8px"><code style="flex:1;background:var(--card);padding:6px 8px;border-radius:8px">${RELAY}</code><button class="btn small" data-act="copyRelay">複製</button></div></div>`;
  else if(!aiReady()&&isOwner&&db)h+=`<p class="hint">這個檢視無法直接辨識照片。上傳後照片會先存起來，再交給 Claude 對話辨識並自動填回。</p>`;
  else if(!aiReady()){
    if(sample&&!aiOff)h+=`<div class="queue"><b>改用文字辨識：</b>${aiWhy()}照片照樣上傳附在收據上，接著在收據畫面打開「貼上收據文字」，就能讓 Claude 整理品項與金額。<br>iPhone 取得文字的方法：在「照片」App 打開收據，長按文字 →「全選」→「拷貝」。</div>`;
    else if(!window.claude)h+=`<div class="queue">想讓照片自動辨識金額？到首頁的 <b>⚙︎ 設定</b> 填入 Claude、OpenAI、Gemini 或 MiniMax 的 API 金鑰即可；不設定也能手動填寫。<button class="btn small" data-act="settings" style="margin-left:6px">前往設定</button></div>`;
    else h+=`<div class="notice">${aiWhy()}照片仍可上傳並附在收據上，金額請手動填寫。</div>`;
  }
  const rs=recOf(t.id);
  if(!rs.length)return h+`<div class="empty"><p>還沒有收據。拍照或從相簿選擇收據、發票，Claude 會讀出品項與金額。</p></div>`;
  h+=`<div class="row" style="margin:6px 0"><input class="inp" data-f="tq" placeholder="在這趟旅程中搜尋店家、品項、付款人…" value="${esc(S.tq)}" style="flex:1"></div>`;
  const q=S.tq.trim().toLowerCase();
  const list=rs.filter(r=>!q||[r.store,r.note,r.date,...r.items.map(i=>i.name),...(r.payers||[]).map(p=>pname(t,p.pid))].join(" ").toLowerCase().includes(q))
    .sort((a,b)=>(b.date||"").localeCompare(a.date||"")||(b.created||"").localeCompare(a.created||""));
  if(!list.length)return h+`<div class="empty"><p>沒有符合「${esc(S.tq)}」的收據。</p></div>`;
  let cur=null;
  list.forEach(r=>{const d=r.date||"";if(d!==cur){cur=d;const dayTot=list.filter(x=>(x.date||"")===d).reduce((s,x)=>s+rTotal(x),0);h+=`<div class="dayhead">${fmtDate(d)} <span>${d?wk(d)+"・":""}${money(dayTot,t.currency)}</span></div>`}h+=rcRow(t,r,false)});
  return h;
}
function tabPeople(t){
  const others=S.contacts.filter(c=>!t.people.some(p=>p.id===c.id));
  let h=others.length?`<h2 class="sec" style="margin-top:8px">從常用成員加入</h2><div class="pick">${others.map(c=>`<button data-act="addContact" data-id="${c.id}">${av(c.id,30)}${esc(c.name)}</button>`).join("")}</div><h2 class="sec">新增成員</h2>`:"";
  h+=`<div class="row" style="margin:8px 0 14px"><input class="inp" id="newPerson" placeholder="輸入名字，例如：小美" style="flex:1" enterkeyhint="done"><button class="btn primary" data-act="addPerson">加入</button></div>`;
  if(!t.people.length)return h+`<div class="empty"><p>加入所有一起出遊、要分攤費用的人。名字可以之後再改。</p></div>`;
  h+=`<div class="people">`;
  t.people.forEach(p=>{h+=`<div class="person">${av(p.id,40,t,true)}<input data-f="pname" data-id="${p.id}" value="${esc(pname(t,p.id))}" aria-label="成員名字"><button class="x" data-act="delPerson" data-id="${p.id}" aria-label="從這趟旅程移除 ${esc(pname(t,p.id))}">✕</button></div>`});
  return h+`</div><p class="hint">點頭像可以上傳照片。成員會存成「常用成員」，其他旅程也能直接加入；在這裡改名或換頭像，所有旅程都會一起更新。按 ✕ 只會把他從這趟旅程移除。</p>`;
}
function tabSettle(t,s){
  if(!t.people.length)return `<div class="empty"><p>加入成員並上傳收據後，這裡會算出每個人該付多少、該轉給誰。</p></div>`;
  let h="";
  if(s.bad.length)h+=`<div class="notice">有 ${s.bad.length} 張收據的付款人或付款金額還沒填好，結算可能不準確：${s.bad.map(r=>`<button class="btn small" data-act="openRc" data-id="${r.id}" style="margin:4px 4px 0 0">${esc(r.store||"未命名")}</button>`).join("")}</div>`;
  h+=`<h2 class="sec">誰該付給誰</h2>`;
  if(!s.transfers.length)h+=`<div class="settled">${s.total?"大家已經兩清，不需要轉帳":"還沒有任何費用"}</div>`;
  else{h+=`<div class="tickets">`;s.transfers.forEach(x=>{h+=`<div class="ticket"><div class="main"><div class="who">${av(x.from,30,t)}${esc(pname(t,x.from))}<span class="arrow">付給</span>${av(x.to,30,t)}${esc(pname(t,x.to))}</div></div><div class="stub"><b class="num">${money(x.amt,t.currency)}</b><span>轉帳金額</span></div></div>`});h+=`</div>`}

function payStatus(t,r){const tot=rTotal(r),pd=rPaid(r);

/* ---------- image + AI ---------- */
function imgFromURL(u){return new Promise((res,rej)=>{const i=new Image();const to=setTimeout(()=>rej(new Error("timeout")),15000);i.onload=()=>{clearTimeout(to);i.naturalWidth?res(i):rej(new Error("empty"))};i.onerror=()=>{clearTimeout(to);rej(new Error("decode"))};i.src=u})}
function readDataURL(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(file)})}
async function loadImg(file){
  // 1) blob URL  2) data URL (some in-app viewers block blob: images)  3) createImageBitmap
  try{const u=URL.createObjectURL(file);try{return await imgFromURL(u)}catch(e){URL.revokeObjectURL(u)}}catch(e){}
  try{return await imgFromURL(await readDataURL(file))}catch(e){}
  if(window.createImageBitmap){try{const b=await createImageBitmap(file);const c=document.createElement("canvas");c.width=b.width;c.height=b.height;c.getContext("2d").drawImage(b,0,0);c.naturalWidth=b.width;c.naturalHeight=b.height;c.src="";return c}catch(e){}}
  throw new Error("無法讀取圖片");
}
function toBlob(img,max,q){const k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement("canvas");c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);return {canvas:c,blob:new Promise(r=>c.toBlob(r,"image/jpeg",q))}}
const PROMPT=`你是收據與發票的辨識助手。圖片是一張旅途中的消費收據、發票或帳單。請讀出消費明細，只回覆一個 JSON 物件，不要任何其他文字：
{"store":"店家名稱或簡短描述","date":"YYYY-MM-DD，看不到就填 null","currency":"ISO 幣別代碼，例如 TWD、JPY","items":[{"name":"品項","amount":數字}],"service":服務費百分比數字（沒有就填 0）,"total":數字}
規則：
- amount 是該行的小計（單價×數量），不要只填單價。
- 折扣、折價券以負數列成一個品項；稅金、小費若另外列出，各自列成一個品項。
- 服務費若是按餐點小計的百分比收取（例如加收 10% 服務費），把百分比數字填在 service，不要把服務費列成品項；若是固定金額的服務費，就列成品項並讓 service 為 0。
- total 是最後實際應付的總額。
- 品項名稱保留原文；若不是中文，在後面用括號附上繁體中文翻譯。
- 看不清楚的數字填最可能的值。若圖片不是收據，items 回傳 []、total 回傳 0。`;
function buildItems(data){const items=(Array.isArray(data.items)?data.items:[]).map(i=>({id:uidGen(),name:String(i.name||"品項"),amount:Number(i.amount)||0,split:null}));
  const sv=Number(data.service);const svc=isFinite(sv)&&sv>0&&sv<100?String(sv):"";
  const sum=items.reduce((s,i)=>s+cents(i.amount),0),tot=cents(data.total),exp=sum+Math.round(sum*(+svc||0)/100);
  if(tot&&exp!==tot&&items.length){const adj=Math.round((tot-exp)/(1+(+svc||0)/100));items.push({id:uidGen(),name:"差額調整（折扣／稅）",amount:adj/100,split:null})}
  return {items,tot,svc}}
const PROMPT_TEXT=PROMPT.replace("圖片是一張旅途中的消費收據、發票或帳單。","下面是從一張旅途消費收據、發票或帳單上複製（或手打）的文字，排版可能錯亂、可能有辨識錯字，請盡量還原。").replace("若圖片不是收據","若文字看不出消費明細");
async function handleFiles(files){
  const t=trip();if(!t)return;
  const list=[...files];list.forEach(f=>S.queue.push({id:uidGen(),name:f.name||"照片",status:"等待中",file:f}));render();
  for(const q of S.queue.filter(x=>x.status==="等待中")){
    q.status="辨識中…";render();
    try{
      const img=await loadImg(q.file);
      const full=await toBlob(img,1800,.85).blob;
      const th=toBlob(img,420,.6).canvas.toDataURL("image/jpeg",.6);
      if(img.src&&img.src.startsWith("blob:"))URL.revokeObjectURL(img.src);
      let data={store:"",date:null,items:[],total:0};
      if(!sample||aiOff||imgOff)q.status=sample&&!aiOff?"已附上照片，請用「貼上收據文字」辨識":"已附上照片，請手動填寫金額";
      else try{data=await sample.json(PROMPT,{images:full})}catch(e){
        if(e.code==="not_granted"){aiOff="你沒有允許這個頁面使用 Claude，所以無法自動辨識（重新整理頁面後可再次授權）。";q.status="已建立空白收據"}
        else if(["images_unavailable","image_rejected"].includes(e.code)){imgOff=true;canImg=false;q.status="已附上照片，請用「貼上收據文字」辨識"}
        else if(["sampling_disabled","capability_disabled","not_declared"].includes(e.code)){aiOff="目前的檢視無法使用 Claude。";q.status="已建立空白收據"}
        else if(e.code==="rate_limited"){q.status="使用量已達上限，已建立空白收據"}
        else q.status=(aiMsg(e)||"辨識失敗")+"，已建立空白收據";
      }
      const {items,tot,svc}=buildItems(data);
      if(!items.length)items.push({id:uidGen(),name:"消費",amount:(tot||0)/100,split:null});
      const d=/^\d{4}-\d{2}-\d{2}$/.test(data.date||"")?data.date:((!t.start||(today()>=t.start&&(!t.end||today()<=t.end)))?today():t.start);
      const r={kind:"receipt",id:uidGen(),tripId:t.id,store:String(data.store||""),date:d,note:"",thumb:th,items,svc,payers:[],aiTotal:tot?tot/100:null,created:new Date().toISOString()};
      try{let ph=toBlob(img,1100,.7).canvas.toDataURL("image/jpeg",.7);if(ph.length>230000)ph=toBlob(img,850,.6).canvas.toDataURL("image/jpeg",.6);if(ph.length<230000)r.photo=ph}catch(e){}
      if(r.photo&&db&&isOwner&&!tot&&!(data.items||[]).length){r.pending=true;q.status="已上傳，等待 Claude 辨識"}
      try{let hi=toBlob(img,2400,.9).canvas.toDataURL("image/jpeg",.9);if(hi.length>2400000)hi=toBlob(img,2400,.8).canvas.toDataURL("image/jpeg",.8);
        const n=await savePhoto(r.id,hi);if(n)r.photoN=n}catch(e){console.warn(e);toast("高解析照片儲存失敗，改存一般畫質")}
      S.receipts.push(r);persist(r);
      if(q.status==="辨識中…")q.status="完成";
      if(!S.edit){S.edit={type:"rc",isNew:false,data:JSON.parse(JSON.stringify(r)),justScanned:true}}
    }catch(e){console.warn(e);q.status="這張圖片無法讀取"}
    render();
  }
  setTimeout(()=>{S.queue=S.queue.filter(q=>q.status==="等待中"||q.status==="辨識中…");render()},4000);
}

function askConfirm(msg,okText="刪除"){return new Promise(res=>{const el=document.createElement("div");el.className="overlay ask-ov";
  el.innerHTML=`<div class="sheet ask" role="alertdialog" aria-modal="true"><div class="sheet-body"><p style="margin:4px 0 18px;font-size:1.02rem">${esc(msg)}</p>
  <div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn" data-a="no">取消</button><button class="btn primary danger-fill" data-a="yes">${esc(okText)}</button></div></div></div>`;
  const done=v=>{el.remove();res(v)};
  el.addEventListener("click",e=>{e.stopPropagation();const b=e.target.closest("[data-a]");if(b)done(b.dataset.a==="yes");else if(e.target===el)done(false)});
  document.body.appendChild(el);el.querySelector('[data-a="yes"]').focus()})}

    S[k]=el.value;const pos=el.selectionStart;render();const n=document.querySelector(`[data-f="${k}"]`);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}return}
  if(!S.edit)return;const d=S.edit.data;
  if(el.dataset.api&&S.edit.type==="settings"){const k=el.dataset.api,pv=d.provider;if(k==="key")d.keys[pv]=el.value.trim();else if(k==="model")d.models[pv]=el.value.trim();else if(k==="ep")d.endpoints[pv]=el.value.trim();return}
  if(el.dataset.e){d[el.dataset.e]=el.dataset.e==="svc"?el.value.replace(/[^\d.]/g,""):el.value;if(el.dataset.e==="svc")refreshTotals();return}
  if(el.dataset.ri!=null){const it=d.items[+el.dataset.ri];it[el.dataset.k]=el.dataset.k==="amount"?el.value.replace(/[^\d.\-]/g,""):el.value;refreshTotals();return}
  if(el.dataset.wi!=null){const it=d.items[+el.dataset.wi];it.weights=it.weights||{};it.weights[el.dataset.id]=el.value.trim();refreshTotals();return}
  if(el.dataset.pi!=null){const p=d.payers[+el.dataset.pi];p[el.dataset.k]=el.dataset.k==="amount"?el.value.replace(/[^\d.\-]/g,""):el.value;refreshTotals();return}
});
document.addEventListener("change",e=>{const el=e.target;
  if(el.dataset.api==="provider"&&S.edit&&S.edit.type==="settings"){S.edit.data.provider=el.value;renderModal();return}
  if(el.dataset.pi!=null&&S.edit){S.edit.data.payers[+el.dataset.pi][el.dataset.k]=el.value;refreshTotals()}
  if(el.dataset.e&&S.edit)S.edit.data[el.dataset.e]=el.value;
  if(el.dataset.f==="pname")render();
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="newPerson"){e.preventDefault();A.addPerson()}
  if(e.key==="Escape"){if(CR){closeCropper();return}if(S.edit)A.close()}});
function hasPhoto(r){return !!(r.photo||r.thumb||r.photoId||r.photoN)}
async function attachPhoto(r,img){
  r.thumb=toBlob(img,420,.6).canvas.toDataURL("image/jpeg",.6);
  let ph=toBlob(img,1100,.7).canvas.toDataURL("image/jpeg",.7);if(ph.length>230000)ph=toBlob(img,850,.6).canvas.toDataURL("image/jpeg",.6);r.photo=ph.length<230000?ph:"";
  delete r.photoId;const oldN=r.photoN||0;
  try{let hi=toBlob(img,2400,.9).canvas.toDataURL("image/jpeg",.9);if(hi.length>2400000)hi=toBlob(img,2400,.8).canvas.toDataURL("image/jpeg",.8);
    const n=await savePhoto(r.id,hi);r.photoN=n||0;for(let i=n;i<oldN;i++)remove(r.id+"_p"+i)}catch(e){console.warn(e);r.photoN=0;toast("高解析照片儲存失敗，改存一般畫質")}}
$("#rcPhoto").addEventListener("change",async e=>{const f=e.target.files[0];if(!f||!S.edit||S.edit.type!=="rc")return;const r=S.edit.data;
  let img;try{img=await loadImg(f)}catch(err){toast("這張照片的格式無法讀取，請改選其他照片或截圖");return}
  S.rcPhotoBusy=true;renderModal();
  try{await attachPhoto(r,img);if(img.src&&String(img.src).startsWith("blob:"))URL.revokeObjectURL(img.src);
    S.edit.photoChanged=true;
    const saved=S.receipts.find(x=>x.id===r.id);if(saved){Object.assign(saved,{thumb:r.thumb,photo:r.photo,photoN:r.photoN});delete saved.photoId;persist(saved)}
    toast("已加入照片")}catch(err){console.warn(err);toast("照片處理失敗："+(err&&err.message||err))}
  S.rcPhotoBusy=false;if(S.edit&&S.edit.data===r)renderModal()});
function newContact(n){const c={kind:"contact",id:uidGen(),name:n,avatar:"",created:new Date().toISOString()};S.contacts.push(c);persist(c);return c}
$("#avatarFile").addEventListener("change",async e=>{const f=e.target.files[0],id=S.avatarFor;if(!f||!id)return;
  let img;try{img=await loadImg(f)}catch(err){toast("這張照片的格式無法讀取，請改選其他照片或截圖");return}
  try{const w=img.naturalWidth||img.width,h=img.naturalHeight||img.height,k=Math.min(1,1600/Math.max(w,h));
    const src=document.createElement("canvas");src.width=Math.round(w*k);src.height=Math.round(h*k);src.getContext("2d").drawImage(img,0,0,src.width,src.height);
    if(img.src&&String(img.src).startsWith("blob:"))URL.revokeObjectURL(img.src);openCropper(id,src)}
  catch(err){console.warn(err);toast("頭像處理失敗："+(err&&err.message||err))}});

/* ---------- avatar cropper ---------- */
let CR=null;
function openCropper(id,src){
  const V=Math.min(300,window.innerWidth-48);
  const el=document.createElement("div");el.className="overlay crop-ov";
  el.innerHTML=`<div class="sheet crop" role="dialog" aria-label="調整頭像"><div class="sheet-head"><button class="btn ghost" data-c="cancel">取消</button><h3>調整頭像</h3><button class="btn ghost" data-c="save"><b>使用</b></button></div>
  <div class="sheet-body" style="display:flex;flex-direction:column;align-items:center;gap:14px">
    <canvas class="crop-cv" style="width:${V}px;height:${V}px" aria-label="拖曳移動，雙指或滑桿縮放"></canvas>
    <div class="crop-tools"><span aria-hidden="true">－</span><input type="range" min="1" max="4" step="0.01" value="1" data-c="zoom" aria-label="縮放"><span aria-hidden="true">＋</span><button class="btn small" data-c="rot" aria-label="旋轉 90 度">↻ 旋轉</button></div>
    <p class="hint" style="margin:0;text-align:center">拖曳移動照片，用雙指或滑桿縮放，圓圈內就是頭像。</p></div></div>`;
  document.body.appendChild(el);
  const cv=el.querySelector("canvas"),dpr=window.devicePixelRatio||1;cv.width=cv.height=Math.round(V*dpr);
  CR={id,src,V,el,cv,ctx:cv.getContext("2d"),z:1,ptr:new Map()};resetCrop();drawCrop();
  const zoom=el.querySelector('[data-c="zoom"]');
  zoom.addEventListener("input",()=>{setZoom(+zoom.value,CR.V/2,CR.V/2)});
  el.addEventListener("click",ev=>{const c=ev.target.closest("[data-c]");if(!c)return;const k=c.dataset.c;
    if(k==="cancel")closeCropper();else if(k==="save")saveCrop();else if(k==="rot"){rotateSrc();zoom.value=1}});
  const pos=ev=>{const r=cv.getBoundingClientRect();return [ev.clientX-r.left,ev.clientY-r.top]};
  cv.addEventListener("pointerdown",ev=>{cv.setPointerCapture(ev.pointerId);CR.ptr.set(ev.pointerId,pos(ev));CR.pinch=null});
  cv.addEventListener("pointermove",ev=>{if(!CR.ptr.has(ev.pointerId))return;const prev=CR.ptr.get(ev.pointerId),cur=pos(ev);CR.ptr.set(ev.pointerId,cur);
    if(CR.ptr.size===1){CR.x+=cur[0]-prev[0];CR.y+=cur[1]-prev[1];clampCrop();drawCrop()}
    else if(CR.ptr.size===2){const [a,b]=[...CR.ptr.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]),mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2;
      if(CR.pinch){setZoom(CR.z*d/CR.pinch.d,mx,my);CR.x+=mx-CR.pinch.mx;CR.y+=my-CR.pinch.my;clampCrop();drawCrop();zoom.value=CR.z}
      CR.pinch={d,mx,my}}});
  const up=ev=>{CR&&CR.ptr.delete(ev.pointerId);if(CR)CR.pinch=null};
  cv.addEventListener("pointerup",up);cv.addEventListener("pointercancel",up);
  cv.addEventListener("wheel",ev=>{ev.preventDefault();const [mx,my]=pos(ev);setZoom(CR.z*(ev.deltaY<0?1.08:1/1.08),mx,my);zoom.value=CR.z},{passive:false});
}
function resetCrop(){const {src,V}=CR;CR.min=V/Math.min(src.width,src.height);CR.z=1;CR.s=CR.min;CR.x=(V-src.width*CR.s)/2;CR.y=(V-src.height*CR.s)/2}
function setZoom(z,cx,cy){z=Math.max(1,Math.min(4,z));const ns=CR.min*z,k=ns/CR.s;CR.x=cx-(cx-CR.x)*k;CR.y=cy-(cy-CR.y)*k;CR.s=ns;CR.z=z;clampCrop();drawCrop()}
function clampCrop(){const {src,V,s}=CR,w=src.width*s,h=src.height*s;CR.x=Math.min(0,Math.max(V-w,CR.x));CR.y=Math.min(0,Math.max(V-h,CR.y))}
function drawCrop(){const {ctx,cv,src,V,s,x,y}=CR,k=cv.width/V;ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);
  ctx.setTransform(k,0,0,k,0,0);ctx.drawImage(src,x,y,src.width*s,src.height*s);
  ctx.fillStyle="rgba(0,0,0,.5)";ctx.beginPath();ctx.rect(0,0,V,V);ctx.arc(V/2,V/2,V/2-2,0,Math.PI*2,true);ctx.fill("evenodd");
  ctx.strokeStyle="rgba(255,255,255,.9)";ctx.lineWidth=2;ctx.beginPath();ctx.arc(V/2,V/2,V/2-2,0,Math.PI*2);ctx.stroke()}
function rotateSrc(){const o=CR.src,c=document.createElement("canvas");c.width=o.height;c.height=o.width;const g=c.getContext("2d");g.translate(c.width,0);g.rotate(Math.PI/2);g.drawImage(o,0,0);CR.src=c;resetCrop();drawCrop()}
function closeCropper(){if(CR){CR.el.remove();CR=null}}
function saveCrop(){try{const {src,V,s,x,y,id}=CR,O=256,k=O/V;const c=document.createElement("canvas");c.width=c.height=O;const g=c.getContext("2d");
    g.fillStyle="#fff";g.fillRect(0,0,O,O);g.drawImage(src,x*k,y*k,src.width*s*k,src.height*s*k);
    let ct=C(id);if(!ct){const t=S.trips.find(t=>t.people.some(p=>p.id===id));ct={kind:"contact",id,name:pname(t,id),avatar:"",created:new Date().toISOString()};S.contacts.push(ct)}
    ct.avatar=c.toDataURL("image/jpeg",.85);persist(ct);closeCropper();
    try{render();if(S.edit)renderModal()}catch(e){console.warn(e)}toast("已更新頭像")}
  catch(err){console.warn(err);toast("頭像處理失敗："+(err&&err.message||err))}}
$("#file").addEventListener("change",e=>{if(e.target.files.length)handleFiles(e.target.files)});

loadLocal();render();initRuntime();if(!window.claude)loadIDB();
})();
</script>
